{% extends 'base.html' %}

{% block title %}Login - AI University LMS{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm border-0" style="border-radius: 16px; padding: 30px;">
        <h3 class="fw-bold mb-4" style="color: var(--navy-dark, #10283F);">Sign In</h3>
        
        {% if form.errors %}
            <div class="alert alert-danger" style="border-radius: 10px; font-size: 14px;">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background: var(--navy, #17324D); border: none; border-radius: 10px;">
                Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}
