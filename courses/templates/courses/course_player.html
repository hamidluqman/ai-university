<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course_title }} - AI University LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #17324D;
            --navy-dark: #10283F;
            --page-bg: #F4F6F8;
            --card: #FFFFFF;
            --border: #E3E8EE;
            --border-light: #EDF0F3;
            --text: #182433;
            --text-muted: #697586;
            --blue: #1677B8;
            --green: #16866F;
            --shadow-sm: 0 5px 16px rgba(23, 50, 77, 0.06);
            --shadow-md: 0 10px 30px rgba(23, 50, 77, 0.08);
        }
        body { 
            background: linear-gradient(180deg, #F8FAFC 0%, #F4F6F8 100%) !important; 
            color: var(--text) !important; 
            font-family: 'Inter', sans-serif !important; 
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "AI UNIVERSITY";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Manrope', sans-serif;
            font-size: 13vw;
            font-weight: 800;
            color: rgba(105, 117, 134, 0.04);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
            user-select: none;
            letter-spacing: 4px;
        }

        .player-container { 
            position: relative;
            z-index: 1;
            max-width: 1400px; 
            margin: 25px auto; 
            padding: 0 15px; 
        }
        
        /* Top Navigation Header Banner */
        .top-banner-nav {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 30px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
            flex-wrap: wrap;
            gap: 15px;
        }
        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .brand-logo-area h4 {
            font-family: 'Manrope', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--navy-dark);
            margin: 0;
        }

        .card-box { 
            background: #FFFFFF; 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            box-shadow: var(--shadow-sm); 
            padding: 24px; 
            margin-bottom: 25px; 
            width: 100%;
        }
        .card-box-header { 
            font-family: 'Manrope', sans-serif; 
            color: var(--navy-dark); 
            font-size: 18px; 
            font-weight: 800; 
            margin-bottom: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        #playerWrapper {
            position: relative;
        }
        #customEndOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(16, 40, 63, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        /* Sidebar Playlist Styling */
        .lesson-btn {
            border: 1px solid var(--border) !important;
            border-radius: 10px !important;
            margin-bottom: 10px;
            background: #F8FAFB !important;
            transition: all 0.2s ease;
        }
        .lesson-btn:hover {
            border-color: var(--blue) !important;
            background: #FFFFFF !important;
        }
        .lesson-btn.active {
            background: var(--navy) !important;
            border-color: var(--navy) !important;
            color: #FFFFFF !important;
        }
        .lesson-btn.active h6, .lesson-btn.active small {
            color: #FFFFFF !important;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            .player-container {
                margin: 15px auto;
                padding: 0 10px;
            }
            .top-banner-nav {
                padding: 16px 20px;
                border-radius: 12px;
            }
            .card-box {
                padding: 16px;
                border-radius: 12px;
            }
            .brand-logo-area h4 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        
        <!-- Top Navigation Banner -->
        <div class="top-banner-nav">
            <div class="brand-logo-area">
                <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
                <h4 class="text-break">AI University LMS</h4>
            </div>
            <div>
                <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-outline-secondary fw-bold px-3 py-2 text-nowrap" style="border-radius: 10px; font-size: 14px;">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>

        <div class="row g-4">
            <!-- Main Video Player Area -->
            <div class="col-lg-8">
                <div class="card-box h-100 mb-0">
                    <div id="playerWrapper" class="ratio ratio-16x9 bg-dark rounded-3 mb-4 overflow-hidden shadow-sm">
                        <div id="youtubePlayer"></div>
                        <!-- Custom Overlay to block YouTube end screen recommendations -->
                        <div id="customEndOverlay">
                            <h5 class="mb-3 fw-bold text-break">Lecture Completed</h5>
                            <button id="replayBtn" class="btn btn-light btn-sm fw-bold px-3 py-2 text-nowrap shadow-sm" style="border-radius: 8px;">Watch Again</button>
                        </div>
                    </div>
                    <h3 id="videoTitle" class="fw-bold mb-2 text-break" style="color: var(--navy-dark); font-family: 'Manrope', sans-serif; font-size: 20px;">Select a lecture from the sidebar</h3>
                    <p id="videoExplanation" class="text-muted small mt-2 mb-0 text-break" style="line-height: 1.6;"></p>
                </div>
            </div>

            <!-- Sidebar Playlist -->
            <div class="col-lg-4">
                <div class="card-box h-100 mb-0 d-flex flex-column">
                    <div class="card-box-header">
                        <span class="text-break"><i class="bi bi-play-circle-fill text-primary me-2"></i> Subtopic Lectures</span>
                        <span class="badge bg-light text-dark border px-2 py-1 text-nowrap">Total: {{ lessons|length }}</span>
                    </div>
                    <div class="list-group list-group-flush flex-grow-1" style="max-height: 480px; overflow-y: auto;">
                        {% for lesson in lessons %}
                            <button type="button" class="list-group-item list-group-item-action lesson-btn p-3 text-start"
                                    data-question-id="{{ lesson.id }}"
                                    data-youtube-url="{{ lesson.youtube_url }}"
                                    data-lesson-title="{{ lesson.question_text }}"
                                    data-lesson-explanation="{{ lesson.explanation|default:'No additional notes provided for this lecture.' }}">
                                <div class="d-flex w-100 justify-content-between align-items-center">
                                    <h6 class="mb-1 fw-bold text-dark text-break" style="font-size: 14px;">#{{ forloop.counter }} - {{ lesson.question_text|truncatechars:45 }}</h6>
                                </div>
                                <small class="text-muted text-nowrap"><i class="bi bi-play-fill"></i> Click to play video</small>
                            </button>
                        {% empty %}
                            <div class="text-center text-muted py-4 text-break">No video lectures found for this selection.</div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentVideoId = "";
        let currentQuestionId = "";
        const lessonButtons = document.querySelectorAll(".lesson-btn");
        const videoTitle = document.getElementById("videoTitle");
        const videoExplanation = document.getElementById("videoExplanation");
        const customEndOverlay = document.getElementById("customEndOverlay");
        const replayBtn = document.getElementById("replayBtn");

        function extractVideoId(rawUrl) {
            if (!rawUrl) return "";
            if (rawUrl.includes("youtu.be/")) {
                return rawUrl.split("youtu.be/")[1]?.split("?")[0];
            } else if (rawUrl.includes("watch?v=")) {
                return rawUrl.split("watch?v=")[1]?.split("&")[0];
            } else if (rawUrl.includes("embed/")) {
                return rawUrl.split("embed/")[1]?.split("?")[0];
            }
            return rawUrl;
        }

        window.onYouTubeIframeAPIReady = function() {
            if (lessonButtons.length > 0) {
                const firstBtn = lessonButtons[0];
                currentVideoId = extractVideoId(firstBtn.getAttribute("data-youtube-url"));
                currentQuestionId = firstBtn.getAttribute("data-question-id");
                
                player = new YT.Player('youtubePlayer', {
                    videoId: currentVideoId,
                    playerVars: {
                        'rel': 0,
                        'modestbranding': 1,
                        'iv_load_policy': 3,
                        'controls': 1
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });

                setActiveButton(firstBtn);
                updateMetadata(firstBtn);
            }
        };

        function onPlayerStateChange(event) {
            if (event.data === 0) {
                customEndOverlay.style.display = "flex";
                
                if (currentQuestionId) {
                    fetch(`/courses/progress/update/${currentQuestionId}/`, {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': '{{ csrf_token }}',
                            'Content-Type': 'application/json'
                        },
                    }).then(response => response.json())
                      .then(data => {
                          console.log("Progress updated:", data.message);
                      }).catch(error => {
                          console.error("Error saving progress:", error);
                      });
                }
            } else {
                customEndOverlay.style.display = "none";
            }
        }

        replayBtn.addEventListener("click", function() {
            customEndOverlay.style.display = "none";
            if (player && typeof player.seekTo === 'function') {
                player.seekTo(0);
                player.playVideo();
            }
        });

        lessonButtons.forEach(button => {
            button.addEventListener("click", function() {
                customEndOverlay.style.display = "none";
                setActiveButton(this);
                updateMetadata(this);

                currentQuestionId = this.getAttribute("data-question-id");
                const newId = extractVideoId(this.getAttribute("data-youtube-url"));
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(newId);
                }
            });
        });

        function setActiveButton(btn) {
            lessonButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        }

        function updateMetadata(btn) {
            videoTitle.textContent = btn.getAttribute("data-lesson-title");
            videoExplanation.textContent = btn.getAttribute("data-lesson-explanation");
        }
    </script>
</body>
</html>
