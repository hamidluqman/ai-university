{% load i18n %}
<div class="filter-item-box" style="display: flex; flex-direction: column; min-width: 160px; flex: 1 1 180px; max-width: 240px;">
  <label style="font-size: 11px; font-weight: 700; color: #4b5563; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;">
    {{ title }}
  </label>
  <select onchange="location = this.options[this.selectedIndex].value;" style="width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 12px; background-color: #f9fafb; color: #111827; cursor: pointer;">
    {% for choice in choices %}
      <option value="{{ choice.query_string }}" {% if choice.selected %}selected{% endif %}>
        {{ choice.display }}
      </option>
    {% endfor %}
  </select>
</div>
