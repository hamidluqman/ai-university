<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI University LMS{% endblock %}</title>
    
    <!-- AdminLTE & Bootstrap 5 Core Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/styles/overlayscrollbars.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Custom Futuristic Glassmorphism Overrides -->
    <style>
        :root {
            --bs-body-bg: #0b0f19;
            --bs-body-color: #cbd5e1;
        }
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            font-family: 'Source Sans 3', sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .table {
            color: #cbd5e1 !important;
        }
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            color: #cbd5e1 !important;
            background-color: rgba(255, 255, 255, 0.02);
        }
        /* Ensure main content spans full width without sidebar padding */
        .app-main {
            margin-left: 0 !important;
            padding: 20px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="layout-fixed bg-body-tertiary">
    <div class="app-wrapper">
        <!-- Main Content Wrapper (Sidebar Completely Removed) -->
        <main class="app-main w-100">
            <div class="app-content-header py-2">
                <div class="container-fluid">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} glass-card alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>
            <div class="app-content">
                <div class="container-fluid px-0">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.3.0/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
