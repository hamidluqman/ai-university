{% extends 'base.html' %}
{% load static %}

{% block title %}Profile Settings - Independent Student Portal{% endblock %}

{% block extra_head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --navy: #17324D;
    --navy-dark: #10283F;
    --page-bg: #F4F6F8;
    --card: #FFFFFF;
    --border: #E3E8EE;
    --border-light: #EDF0F3;
    --text: #182433;
    --text-muted: #697586;
    --blue: #1677B8;
    --green: #16866F;
    --shadow-sm: 0 5px 16px rgba(23, 50, 77, 0.06);
    --shadow-md: 0 10px 30px rgba(23, 50, 77, 0.08);
}
body { background: var(--page-bg) !important; color: var(--text) !important; font-family: 'Inter', sans-serif !important; }
.student-container { max-width: 900px; margin: 35px auto; padding: 0 15px; }
.card-box { background: #FFFFFF; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 30px; margin-bottom: 25px; }
.card-box-header { font-family: 'Manrope', sans-serif; color: var(--navy-dark); font-size: 20px; font-weight: 800; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; }
.form-control { background-color: #FFFFFF !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: 10px; padding: 12px; }
.form-control:focus { border-color: var(--blue) !important; box-shadow: 0 0 0 0.2rem rgba(22, 119, 184, 0.15) !important; }
.form-control:disabled, .form-control[readonly] { background-color: var(--page-bg) !important; color: var(--text-muted) !important; }
.nav-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; background: #FFFFFF; border: 1px solid var(--border); color: var(--navy); font-size: 14px; font-weight: 700; text-decoration: none; transition: all 0.2s ease; }
.nav-btn:hover { background: var(--page-bg); color: var(--navy-dark); border-color: #CBD5DF; }
</style>
{% endblock %}

{% block content %}
<div class="student-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: var(--navy-dark); font-family: 'Manrope', sans-serif;">Student Profile Settings</h2>
        <a href="{% url 'accounts:dashboard_redirect' %}" class="nav-btn"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="card-box">
        <div class="card-box-header">
            <span><i class="bi bi-person-badge text-primary me-2"></i> Account Information</span>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Username (Locked)</label>
                <input type="text" class="form-control" value="{{ request.user.username }}" readonly disabled>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Full Name (Locked)</label>
                <input type="text" class="form-control" value="{{ request.user.get_full_name|default:'N/A' }}" readonly disabled>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Phone Number (Editable)</label>
                <input type="text" name="phone_number" class="form-control" value="{{ phone_number }}" placeholder="Enter phone number">
            </div>
            <hr class="my-4 text-muted">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">New Password (Optional)</label>
                <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password">
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'accounts:dashboard_redirect' %}" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">Cancel</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold text-white rounded-pill shadow-sm" style="background-color: var(--blue);">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
