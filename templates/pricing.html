{% if request.session.show_expiration_modal %}
  <!-- Subscription Expired Flashcard Modal -->
  <div class="modal fade show" id="subscriptionExpiredModal" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden; background-color: #FFFFFF;">
        <div class="modal-header bg-danger text-white px-4 py-3">
          <h5 class="modal-title fw-bold text-break" style="font-family: 'Manrope', sans-serif; font-size: 18px;">⚠️ Subscription Expired</h5>
          <button type="button" class="btn-close btn-close-white" onclick="closeModal()"></button>
        </div>
        <div class="modal-body text-center p-4">
          <div class="mb-3">
            <span style="font-size: 48px;">⌛</span>
          </div>
          <h4 class="fw-bold text-dark text-break mb-2" style="font-family: 'Manrope', sans-serif; font-size: 20px;">Access Locked</h4>
          <p class="text-muted mt-2 text-break small">
            {{ request.session.expiration_message }}
          </p>
          <p class="small text-secondary text-break mb-0">Please renew your plan below to restore instant access to the Question Bank.</p>
        </div>
        <div class="modal-footer bg-light justify-content-center px-4 py-3 flex-wrap gap-2">
          <button type="button" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold text-nowrap" onclick="closeModal()" style="font-size: 14px;">Close</button>
          <a href="#plans-section" class="btn btn-success fw-bold px-4 py-2 rounded-pill text-nowrap shadow-sm" onclick="closeModal()" style="font-size: 14px; background-color: var(--green, #16866F); border-color: var(--green, #16866F);">Renew Subscription</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function closeModal() {
      const modal = document.getElementById('subscriptionExpiredModal');
      if (modal) modal.style.display = 'none';
    }
  </script>
{% endif %}
