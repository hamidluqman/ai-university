{% if request.session.show_expiration_modal %}
  <!-- Subscription Expired Flashcard Modal -->
  <div class="modal fade show" id="subscriptionExpiredModal" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold">⚠️ Subscription Expired</h5>
          <button type="button" class="btn-close btn-close-white" onclick="closeModal()"></button>
        </div>
        <div class="modal-body text-center p-4">
          <div class="mb-3">
            <span style="font-size: 48px;">⌛</span>
          </div>
          <h4 class="fw-bold text-dark">Access Locked</h4>
          <p class="text-muted mt-2">
            {{ request.session.expiration_message }}
          </p>
          <p class="small text-secondary">Please renew your plan below to restore instant access to the Question Bank.</p>
        </div>
        <div class="modal-footer bg-light justify-content-center">
          <button type="button" class="btn btn-secondary px-4" onclick="closeModal()">Close</button>
          <a href="#plans-section" class="btn btn-success fw-bold px-4" onclick="closeModal()">Renew Subscription</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function closeModal() {
      document.getElementById('subscriptionExpiredModal').style.display = 'none';
    }
  </script>
{% endif %}
