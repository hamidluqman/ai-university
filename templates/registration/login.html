<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI University LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
        --navy: #17324D;
        --navy-dark: #10283F;
        --page-bg: #F4F6F8;
        --card: #FFFFFF;
        --border: #E3E8EE;
        --border-light: #EDF0F3;
        --text: #182433;
        --text-muted: #697586;
        --blue: #1677B8;
        --green: #16866F;
        --shadow-sm: 0 5px 16px rgba(23, 50, 77, 0.06);
        --shadow-md: 0 10px 30px rgba(23, 50, 77, 0.08);
    }
    body {
        background: linear-gradient(180deg, #F8FAFC 0%, #F4F6F8 100%) !important;
        color: var(--text) !important;
        font-family: 'Inter', sans-serif !important;
        min-height: 100vh;
        position: relative;
    }
    body::before {
        content: "AI UNIVERSITY";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        font-family: 'Manrope', sans-serif;
        font-size: 13vw;
        font-weight: 800;
        color: rgba(105, 117, 134, 0.04);
        white-space: nowrap;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        letter-spacing: 4px;
    }
    .login-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        margin: auto;
        padding: 15px;
    }
    .card-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        padding: 35px;
    }
    .form-label {
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        color: var(--navy-dark);
        font-size: 14px;
        margin-bottom: 8px;
    }
    .form-control, .form-select {
        border: 1px solid var(--border) !important;
        border-radius: 10px !important;
        padding: 12px 16px !important;
        font-size: 15px !important;
        color: var(--text) !important;
        background-color: #FFFFFF !important;
        width: 100%;
    }
    .form-control:focus {
        border-color: var(--blue) !important;
        box-shadow: 0 0 0 3px rgba(22, 119, 184, 0.1) !important;
    }
    /* Style default Django form fields rendered via as_p */
    form p {
        margin-bottom: 20px;
    }
    form p label {
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        color: var(--navy-dark);
        font-size: 14px;
        margin-bottom: 8px;
        display: block;
    }
    form p input {
        border: 1px solid var(--border) !important;
        border-radius: 10px !important;
        padding: 12px 16px !important;
        font-size: 15px !important;
        color: var(--text) !important;
        background-color: #FFFFFF !important;
        width: 100%;
        display: block;
    }
    form p input:focus {
        border-color: var(--blue) !important;
        box-shadow: 0 0 0 3px rgba(22, 119, 184, 0.1) !important;
        outline: none;
    }
    form p helptext, form p .helptext {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 5px;
        display: block;
    }
    .login-btn {
        background: var(--navy) !important;
        color: #FFFFFF !important;
        border: none !important;
        border-radius: 12px !important;
        padding: 14px !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        width: 100%;
        transition: background 0.2s ease;
        box-shadow: 0 4px 12px rgba(23, 50, 77, 0.15);
    }
    .login-btn:hover {
        background: var(--navy-dark) !important;
    }

    @media (max-width: 768px) {
        .card-box {
            padding: 24px 20px;
            border-radius: 12px;
        }
    }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="login-wrapper">
        <div class="card-box bg-white">
            <div class="text-center mb-4">
                <span class="badge bg-success text-white px-3 py-1 mb-2 rounded-pill fw-bold text-nowrap" style="font-size: 11px;">Institutional Portal</span>
                <h3 class="fw-extrabold text-dark m-0 text-break" style="font-family: 'Manrope', sans-serif; font-size: 22px;">AI University Login</h3>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="login-btn mt-2 text-nowrap">Log In</button>
            </form>
        </div>
    </div>
</body>
</html>
