<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Pending - AI University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
        --navy: #17324D;
        --navy-dark: #10283F;
        --page-bg: #F4F6F8;
        --card: #FFFFFF;
        --border: #E3E8EE;
        --border-light: #EDF0F3;
        --text: #182433;
        --text-muted: #697586;
        --blue: #1677B8;
        --green: #16866F;
        --shadow-sm: 0 5px 16px rgba(23, 50, 77, 0.06);
        --shadow-md: 0 10px 30px rgba(23, 50, 77, 0.08);
    }
    body {
        background: linear-gradient(180deg, #F8FAFC 0%, #F4F6F8 100%) !important;
        color: var(--text) !important;
        font-family: 'Inter', sans-serif !important;
        min-height: 100vh;
        position: relative;
    }
    body::before {
        content: "AI UNIVERSITY";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        font-family: 'Manrope', sans-serif;
        font-size: 13vw;
        font-weight: 800;
        color: rgba(105, 117, 134, 0.04);
        white-space: nowrap;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        letter-spacing: 4px;
    }
    .pending-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 500px;
        margin: auto;
        padding: 15px;
    }
    .card-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        padding: 40px 35px;
    }
    .pending-btn-primary {
        background: var(--navy) !important;
        color: #FFFFFF !important;
        border: none !important;
        border-radius: 12px !important;
        padding: 14px !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        width: 100%;
        transition: background 0.2s ease;
        box-shadow: 0 4px 12px rgba(23, 50, 77, 0.15);
        text-decoration: none;
        display: block;
        text-align: center;
    }
    .pending-btn-primary:hover {
        background: var(--navy-dark) !important;
        color: #FFFFFF !important;
    }
    .pending-btn-outline {
        background: #FFFFFF !important;
        color: var(--text-muted) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        padding: 14px !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        width: 100%;
        transition: all 0.2s ease;
        text-decoration: none;
        display: block;
        text-align: center;
    }
    .pending-btn-outline:hover {
        background: #F8FAFC !important;
        color: var(--text) !important;
        border-color: #CBD5DF !important;
    }

    @media (max-width: 768px) {
        .card-box {
            padding: 24px 20px;
            border-radius: 12px;
        }
    }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="pending-wrapper">
    <div class="card-box bg-white text-center">
        <div class="mb-3 text-warning">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-clock-history" viewBox="0 0 16 16">
                <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.032.984a7 7 0 0 0-.938-.598l.452-.88a8 8 0 0 1 1.035.657zM3.55 1.534a7 7 0 0 0-.992.536l.6 1.05a8 8 0 0 1 .914-.492zM14 8A6 6 0 1 1 6 2a6 6 0 0 1 8 6"/>
                <path d="M8.5 5.5a.5.5 0 0 0-1 0v3.25a.5.5 0 0 0 1.025.15l1.5-1.5a.5.5 0 0 0-.707-.708L8.5 8.793z"/>
            </svg>
        </div>
        <span class="badge bg-warning-subtle text-warning border border-warning px-3 py-1 mb-2 rounded-pill fw-bold text-nowrap" style="font-size: 11px;">Verification Required</span>
        <h3 class="fw-extrabold text-dark mb-2 text-break" style="font-family: 'Manrope', sans-serif; font-size: 22px;">Account Pending Activation</h3>
        <p class="text-muted small mb-4 text-break">
            Your subscription is currently pending payment verification. Please submit your payment receipt or transaction reference so our team can approve your access.
        </p>
        <div class="d-flex flex-column gap-2">
            <a href="{% url 'subscriptions:submit_payment' %}" class="pending-btn-primary text-nowrap">Submit Payment Receipt</a>
            <a href="{% url 'accounts:logout' %}" class="pending-btn-outline text-nowrap">Log Out</a>
        </div>
    </div>
</div>
</body>
</html>
